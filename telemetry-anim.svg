<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="Osciloscopio con una señal analógica y otra digital en tiempo real" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#12414f" stroke-width="1"/></pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="scr"><rect x="20" y="20" width="860" height="160" rx="6"/></clipPath>
  </defs>
  <rect width="900" height="200" rx="14" fill="#041820"/>
  <rect x="20" y="20" width="860" height="160" rx="6" fill="#03121a" stroke="#1d6a7a" stroke-width="1.5"/>
  <g clip-path="url(#scr)">
    <rect x="20" y="20" width="860" height="160" fill="url(#g)"/>
    <path d="M0 75 Q37.5 15 75 75 T150 75 T225 75 T300 75 T375 75 T450 75 T525 75 T600 75 T675 75 T750 75 T825 75 T900 75 T975 75 T1050 75" transform="translate(20 0)" fill="none" stroke="#5ee7ff" stroke-width="2.5" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" from="20 0" to="-130 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M0 160 V130 H50 V160 H100 V130 H150 V160 H200 V130 H250 V160 H300 V130 H350 V160 H400 V130 H450 V160 H500 V130 H550 V160 H600 V130 H650 V160 H700 V130 H750 V160 H800 V130 H850 V160 H900 V130 H950 V160 H1000 V130 H1050 V160 H1100" transform="translate(20 0)" fill="none" stroke="#ffb547" stroke-width="2.5" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" from="20 0" to="-80 0" dur="2s" repeatCount="indefinite"/>
    </path>
    <rect y="20" width="2" height="160" fill="#5ef2d6" opacity="0.5">
      <animate attributeName="x" from="20" to="878" dur="5s" repeatCount="indefinite"/>
    </rect>
