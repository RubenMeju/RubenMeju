<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Código que viaja por un circuito hasta un ESP32 y activa sensores, la nube y un LED" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#12414f"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062431"/>
      <stop offset="1" stop-color="#041820"/>
    </linearGradient>
    <clipPath id="c0"><rect x="34" y="78" height="18" width="0"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.02;0.09;0.92;1" values="0;0;250;250;0"/></rect></clipPath>
    <clipPath id="c1"><rect x="34" y="102" height="18" width="0"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.11;0.18;0.92;1" values="0;0;250;250;0"/></rect></clipPath>
    <clipPath id="c2"><rect x="34" y="126" height="18" width="0"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.20;0.27;0.92;1" values="0;0;250;250;0"/></rect></clipPath>
    <clipPath id="c3"><rect x="34" y="150" height="18" width="0"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.29;0.36;0.92;1" values="0;0;250;250;0"/></rect></clipPath>
    <clipPath id="c4"><rect x="34" y="174" height="18" width="0"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.38;0.45;0.92;1" values="0;0;250;250;0"/></rect></clipPath>
    <clipPath id="c5"><rect x="34" y="198" height="18" width="0"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.47;0.54;0.92;1" values="0;0;250;250;0"/></rect></clipPath>
  </defs>

  <rect width="900" height="320" rx="14" fill="url(#bg)"/>
  <rect width="900" height="320" rx="14" fill="url(#grid)"/>

  <!-- Code panel -->
  <rect x="20" y="40" width="290" height="200" rx="8" fill="#03121a" stroke="#1d6a7a" stroke-width="1.5"/>
  <path d="M20 48a8 8 0 0 1 8-8h274a8 8 0 0 1 8 8v14H20z" fill="#0b2e3b"/>
  <circle cx="36" cy="51" r="4" fill="#ff6b6b"/><circle cx="50" cy="51" r="4" fill="#ffb547"/><circle cx="64" cy="51" r="4" fill="#5ef2d6"/>
  <text x="90" y="55" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#7fb6c4">main.ts</text>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#cfeaf1">
    <text x="34" y="92" clip-path="url(#c0)"><tspan fill="#5ee7ff">const</tspan> t = <tspan fill="#5ee7ff">await</tspan> esp32.read();</text>
    <text x="34" y="116" clip-path="url(#c1)"><tspan fill="#5ee7ff">await</tspan> api.post(<tspan fill="#ffb547">"/telemetry"</tspan>, {</text>
    <text x="34" y="140" clip-path="url(#c2)">  temp: t.celsius,</text>
    <text x="34" y="164" clip-path="url(#c3)">  ts: Date.now(),</text>
    <text x="34" y="188" clip-path="url(#c4)">});</text>
    <text x="34" y="212" clip-path="url(#c5)">led.write(t.celsius &gt; <tspan fill="#ffb547">30</tspan>);</text>
  </g>

  <!-- Traces -->
  <g fill="none" stroke="#1d6a7a" stroke-width="2" stroke-linejoin="round">
    <path d="M310 100H350V135H400"/>
    <path d="M310 140H400"/>
    <path d="M310 180H350V145H400"/>
    <path d="M520 135H580V80H636"/>
    <path d="M520 145H580V160H636" />
    <path d="M520 155H560V240H636"/>
  </g>

  <!-- Chip -->
  <g>
    <g stroke="#c8894a" stroke-width="8" stroke-dasharray="6 8">
      <path d="M408 108H512"/><path d="M408 192H512"/>
      <path d="M402 116V184"/><path d="M518 116V184"/>
    </g>
    <rect x="410" y="110" width="100" height="80" rx="6" fill="#0b2e3b" stroke="#5ef2d6" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="424" cy="124" r="3" fill="#5ef2d6"/>
    <text x="460" y="146" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#e8fbff">ESP32</text>
    <text x="460" y="166" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#7fb6c4">firmware</text>
  </g>

  <!-- Input pulses (código → chip) -->
  <g fill="#5ee7ff" filter="url(#glow)">
    <circle r="3.5"><animateMotion dur="2.6s" repeatCount="indefinite" path="M310 100H350V135H400"/></circle>
    <circle r="3.5"><animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite" path="M310 140H400"/></circle>
    <circle r="3.5"><animateMotion dur="2.6s" begin="1.7s" repeatCount="indefinite" path="M310 180H350V145H400"/></circle>
  </g>
  <!-- Output pulses (chip → mundo físico) -->
  <g fill="#ffb547" filter="url(#glow)">
    <circle r="3.5"><animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite" path="M520 135H580V80H636"/></circle>
    <circle r="3.5"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M520 145H580V160H636"/></circle>
    <circle r="3.5"><animateMotion dur="2.4s" begin="2s" repeatCount="indefinite" path="M520 155H560V240H636"/></circle>
  </g>

  <!-- Output nodes -->
  <g stroke="#5ef2d6" stroke-width="2" fill="#062431">
    <circle cx="660" cy="80" r="24"/>
    <circle cx="660" cy="160" r="24"/>
    <circle cx="660" cy="240" r="24"/>
  </g>
  <!-- sensor -->
  <g fill="#5ef2d6" stroke="none">
    <rect x="656" y="66" width="8" height="20" rx="4"/>
    <circle cx="660" cy="91" r="6"/>
  </g>
  <!-- cloud -->
  <path d="M646 167a8 8 0 0 1 2-15a11 11 0 0 1 21-2a8 8 0 0 1 2 17z" fill="#5ef2d6">
    <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </path>
  <!-- LED -->
  <g stroke="#ffb547" stroke-width="2" stroke-linecap="round">
    <path d="M660 222v-3M660 258v3M642 240h-3M678 240h3M647 227l-2-2M673 253l2 2M673 227l2-2M647 253l-2 2">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" begin="2s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="660" cy="240" r="8" fill="#ffb547" filter="url(#glow)">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#cfeaf1">
    <text x="696" y="85">sensor DHT22</text>
    <text x="696" y="165">API + nube</text>
    <text x="696" y="245">LED / relé</text>
  </g>

  <text x="450" y="290" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#7fb6c4">del código al mundo físico</text>
</svg>
