name: Actualizar estadísticas

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar github-stats.svg
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_USER: RubenMeju
        run: python3 stats.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualizar estadísticas"
            git push
          fi
